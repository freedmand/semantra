[package]
name = "semantra"
version = "0.2.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "semantra_lib"
# NOTE: `staticlib` is intentionally omitted. It is only needed for mobile (iOS)
# targets, which this desktop-only app does not ship — the desktop binary
# consumes the lib as `rlib`. Building `staticlib` bundles the ENTIRE dependency
# closure into one `.lib` archive; once Windows pulls in statically-linked Intel
# MKL (hundreds of MB), that archive overflows a 32-bit size field in rustc's
# archive writer and ICEs ("TryFromIntError" at ar_archive_writer.rs). Dropping
# the unused crate-type sidesteps the giant archive entirely.
crate-type = ["cdylib", "rlib"]

# Explicit binary target so the executable (and thus the macOS dock label in
# `tauri dev`) is title-cased "Semantra" rather than the lowercase crate name.
# The package/lib names stay lowercase per Rust convention.
[[bin]]
name = "Semantra"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Async test harness for the VectorStore integration tests (LanceDB is async).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Integration tests open a temp LanceDB connection directly to construct stores.
lancedb = "0.30"

[dependencies]
# `protocol-asset` enables the `asset:`/`convertFileSrc` protocol so PDF.js can
# stream copied PDFs from the app-data dir (scoped in tauri.conf.json).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
# Native "open file" dialog so the frontend can hand the backend a real
# filesystem path (an HTML <input type=file> in the webview yields no path).
# PDF parsing then reads straight from that path via pdfium.
tauri-plugin-dialog = "2"
# In-app updates from GitHub Releases (latest.json); process for relaunch.
tauri-plugin-updater = "~2.12"
tauri-plugin-process = "~2.3"
# Native alert for startup failures (before the webview is usable). Already in
# the tree via tauri-plugin-dialog.
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Lenient text decoding for indexed `.txt` files. Many real-world text files
# aren't UTF-8 (Windows-1252, ISO-8859-*, Shift-JIS, GBK, …). `chardetng` is
# Firefox's charset detector (by the encoding_rs author) — it sniffs the bytes
# and picks the encoding, which `encoding_rs` then decodes. encoding_rs is already
# in the tree transitively; declared directly so we can name it.
chardetng = "0.1"
encoding_rs = "0.8"

# RFC 4180 CSV parsing for the `.csv` extractor. Correctly handles quoted fields
# with embedded commas, quotes, and newlines, which a naive line/split would
# mangle — important since each field becomes its own embedded chunk and cell
# values are stored verbatim.
csv = "1"

# PDFium binding for PDF text extraction. `default-features = false` drops the
# `image_latest` feature (and the heavy `image` crate) — we only pull text, never
# render. We do NOT enable `static`, so the crate binds *dynamically* via
# `libloading` to a bundled `libpdfium` at runtime (fetched per-target by
# build.rs, shipped as a Tauri resource). `thread_safe` wraps the non-reentrant
# C library in a mutex so it is safe to call from blocking tasks.
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe"] }

# EmbeddingGemma 2 on MLX (text + image + audio + video into one 768-d space).
# Path dependency so the MLX build (CMake, ~3 min the first time) is compiled
# once and cached separately from the frequently-rebuilt app code. Apple
# Silicon only: MLX is Metal-backed.
semantra-embed = { path = "../semantra-embed" }
# Error type returned by inference-thread closures (semantra-embed is anyhow-based).
anyhow = "1"
# Thumbnails cross the IPC boundary as `data:image/jpeg;base64,…` URLs.
base64 = "0.22"

# On-disk vector store for indexed chunks. LanceDB 0.30 has NO default features,
# so this pulls in only the local embedded store + IVF/HNSW indexes — none of the
# remote/cloud (reqwest, aws-lc, openssl) or embedding-function (candle, openai)
# features that complicate cross-compilation. `arrow-*` is pinned to the exact
# version LanceDB re-exports so we build RecordBatches it accepts without a dup.
lancedb = "0.30"
arrow-array = "58"
arrow-schema = "58"
# Temp files for vector-store tests and in-app voice recordings (AVFoundation
# decodes from a path).
tempfile = "3"
futures = "0.3"

# Content-addressed file dedup: SHA-512 of the raw bytes keys the `files` table,
# so identical files are copied/embedded once regardless of how many projects
# reference them. `uuid` mints project ids for the (future) multi-project UI.
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

# Async primitives for the indexing pipeline: a `Mutex` guarding the (async)
# vector store in Tauri state, and an `mpsc` channel feeding embedded batches
# from the blocking inference thread to the async inserter. Already in the tree
# transitively via LanceDB; declared directly so we can name the types.
tokio = { version = "1", features = ["sync"] }

# Optimize ALL dependencies even in dev/`tauri dev` builds — tokenizers and the
# LanceDB stack are painfully slow unoptimized. App code itself stays
# unoptimized for fast incremental rebuilds. (MLX's C++/Metal core is built by
# CMake in Release regardless of the Cargo profile.)
[profile.dev.package."*"]
opt-level = 3

# Size-optimized release. The shipped binary is dominated by the
# LanceDB/DataFusion/Arrow/sqlparser stack (a full columnar SQL engine pulled in
# for the vector store) — NOT the ML runtime, whose hot path is MLX's
# CMake-built C++/Metal (unaffected by these flags). So squeezing Rust code size
# costs nothing on embedding speed.
#
#   opt-level = "z"     optimize for size over speed (smallest codegen)
#   lto = "fat"         whole-program inlining + cross-crate dead-code elimination
#   codegen-units = 1   no parallel-codegen duplication; maximizes LTO's reach
#   strip = true        drop the symbol table (__LINKEDIT)
#   panic = "abort"     no unwind tables/landing pads. NOTE: a panic now aborts
#                       the process instead of unwinding.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The tokenizer runs on every chunk and query; keep it at full speed.
[profile.release.package.tokenizers]
opt-level = 3

# Vendored fix for lance-linalg 7.0.0: its build.rs compiles the AVX-512
# dist_table.c kernel with `-march=native`. Harmless on Apple Silicon (the
# kernel is x86-only and runtime-gated), but kept so the dependency resolves
# identically; drop once upstream fixes the flag.
[patch.crates-io]
lance-linalg = { path = "vendor/lance-linalg" }
