[package]
name = "semantra-embed"
version = "0.1.0"
edition = "2021"

# EmbeddingGemma 2 (google/embeddinggemma-2): a Gemma-4 text backbone plus
# vision and audio towers that all embed into one shared 768-d space, with
# per-token states kept reachable for `explain`.
#
# Two backends behind one `Model` API, chosen at build time (see build.rs):
# - Apple Silicon: MLX (mlx-rs), the towers implemented directly against MLX
#   ops. MLX is compiled from source by mlx-sys (CMake + the Xcode Metal
#   toolchain: `xcodebuild -downloadComponent MetalToolchain`).
# - Everywhere else (Windows, Linux, Intel Macs): ONNX Runtime over the
#   onnx-community fp16 export, GPU via WebGPU/DirectML where available.

[features]
# Use the ONNX Runtime backend on Apple Silicon too (to test it locally).
onnx = []

[dependencies]
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Runtime-agnostic oneshot + block_on for the inference-thread service.
futures-channel = "0.3"
futures-executor = "0.3"
# SIMD Catmull-Rom resize matching the reference processor's antialiased
# bicubic (all platforms).
fast_image_resize = "6"
# CPU FFT for the log-mel front end on the ONNX backend (`log_mel_cpu`).
realfft = "3"
# ONNX Runtime, loaded at runtime from the bundled library (`load-dynamic`).
# Unused on Apple Silicon builds, which run MLX.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "webgpu", "directml", "coreml", "api-27"] }
ndarray = "0.17"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-rs = "0.32"

# Native media decoding on macOS (Apple Silicon and Intel): ImageIO (every
# format Photos/Preview opens, incl. HEIC/RAW, with EXIF orientation) +
# CoreGraphics for pixel buffers, and AVFoundation for audio/video: decoded,
# resampled 16 kHz mono PCM and 1 fps frames (with the track's rotation
# applied), for any container/codec the OS plays.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-image-io = "0.3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-graphics"] }
objc2-core-media = "0.3"

# Portable media decoding elsewhere (Windows, Linux): semantra-media-portable
# — `image` + moxcms for stills, Symphonia + Rubato for audio, and an ffmpeg
# CLI sidecar for video frames and the audio codecs Symphonia lacks.
[target.'cfg(not(target_os = "macos"))'.dependencies]
semantra-media-portable = { path = "../semantra-media-portable" }

[dev-dependencies]
# Reads the 16-bit PCM WAV fixtures in the golden parity tests.
hound = "3"
