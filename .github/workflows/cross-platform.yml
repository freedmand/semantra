name: Cross-platform (ONNX backend)

# Builds and tests the ONNX Runtime embedding backend on every non-Apple-Silicon
# platform — Windows, Linux, Intel Mac — and produces an (unsigned) installer
# per platform as a workflow artifact. Apple Silicon keeps MLX and is covered by
# release.yml.
#
# Runs on pushes to experiment branches and on demand. Runners have no GPU, so
# the smoke test forces ONNX Runtime's CPU provider; GPUs (WebGPU via D3D12 /
# Vulkan) are used automatically on real machines.

on:
  push:
    branches:
      - "exp/**"
  workflow_dispatch:

# A newer push supersedes an in-flight run (each run includes a long Intel Mac
# ONNX Runtime source build until its cache is warm).
concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            ort: windows-x64
            bundle_glob: "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*"
          - name: Linux x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            ort: linux-x64
            bundle_glob: "src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/*/*"
          - name: macOS (Intel)
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            ort: macos-x64
            bundle_glob: "src-tauri/target/x86_64-apple-darwin/release/bundle/*/*"

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf

      # lance/datafusion run protoc at build time.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            semantra-embed -> target
            src-tauri -> target
          key: ${{ matrix.rust_target }}

      # Intel Macs: Microsoft publishes no x86_64 macOS ONNX Runtime after 1.16,
      # so build 1.27 from source once and cache it (~1 h on the runner).
      # Restored here and saved right after the build (not at job end), so a
      # later failing step doesn't throw away the ~25 min build.
      - name: Restore ONNX Runtime source build (Intel Mac)
        id: ort-cache
        if: matrix.ort == 'macos-x64'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/semantra/onnxruntime-1.27.0/onnxruntime/build/x86_64/Release/libonnxruntime.1.27.0.dylib
          key: onnxruntime-1.27.0-macos-x64-v1

      - name: Fetch ONNX Runtime
        run: bash src-tauri/scripts/fetch-onnxruntime.sh ${{ matrix.ort }}

      - name: Save ONNX Runtime source build (Intel Mac)
        if: matrix.ort == 'macos-x64' && steps.ort-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/semantra/onnxruntime-1.27.0/onnxruntime/build/x86_64/Release/libonnxruntime.1.27.0.dylib
          key: onnxruntime-1.27.0-macos-x64-v1

      - name: Cache ONNX model
        uses: actions/cache@v4
        with:
          path: src-tauri/models/embeddinggemma-2-onnx
          key: embeddinggemma-2-onnx-fp16-v1

      - name: Fetch ONNX model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash src-tauri/scripts/fetch-model-onnx.sh

      # Windows/Linux: the ffmpeg sidecar the portable decoders use for video
      # (and HEIC / extra audio codecs). Bundled via bundle.externalBin.
      - name: Fetch ffmpeg sidecar
        if: runner.os != 'macOS'
        run: bash src-tauri/scripts/fetch-ffmpeg.sh ${{ matrix.ort }}

      # Test media for the smoke test: made with the sidecar where there is one,
      # else (Intel Mac, native AVFoundation decoding) with Python's stdlib.
      - name: Generate test media
        run: |
          mkdir -p "$RUNNER_TEMP/media"
          ff="$(find "$GITHUB_WORKSPACE/src-tauri/binaries" -name 'ffmpeg-*' 2>/dev/null | head -1)"
          if [[ -n "$ff" ]]; then
            "$ff" -loglevel error -f lavfi -i testsrc=size=1280x720:rate=1 -frames:v 1 "$RUNNER_TEMP/media/still.png"
            "$ff" -loglevel error -f lavfi -i sine=frequency=440:duration=5 -ar 44100 -ac 2 "$RUNNER_TEMP/media/tone.wav"
            "$ff" -loglevel error -f lavfi -i testsrc=size=1280x720:rate=24 -f lavfi -i sine=frequency=330 \
              -t 18 -pix_fmt yuv420p -c:v libopenh264 -c:a aac -shortest "$RUNNER_TEMP/media/clip.mp4" \
              || "$ff" -loglevel error -f lavfi -i testsrc=size=1280x720:rate=24 -t 18 -pix_fmt yuv420p "$RUNNER_TEMP/media/clip.mp4"
            echo "SMOKE_MEDIA=$RUNNER_TEMP/media/still.png $RUNNER_TEMP/media/tone.wav $RUNNER_TEMP/media/clip.mp4" >> "$GITHUB_ENV"
            echo "SEMANTRA_FFMPEG=$ff" >> "$GITHUB_ENV"
          else
            python3 - "$RUNNER_TEMP/media" <<'PY'
          import math, struct, sys, wave, zlib
          out = sys.argv[1]
          w, h = 640, 480
          raw = b"".join(b"\0" + b"".join(bytes((x * 255 // w, y * 255 // h, 128)) for x in range(w)) for y in range(h))
          def chunk(t, d): return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          open(f"{out}/still.png", "wb").write(png)
          with wave.open(f"{out}/tone.wav", "wb") as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(44100)
              f.writeframes(b"".join(struct.pack("<h", int(12000 * math.sin(2 * math.pi * 440 * i / 44100))) for i in range(44100 * 5)))
          PY
            echo "SMOKE_MEDIA=$RUNNER_TEMP/media/still.png $RUNNER_TEMP/media/tone.wav" >> "$GITHUB_ENV"
          fi
          ls -la "$RUNNER_TEMP/media"

      - name: semantra-embed unit tests
        working-directory: semantra-embed
        run: cargo test --release --lib --target ${{ matrix.rust_target }}

      - name: Portable media decoder tests
        if: runner.os != 'macOS'
        working-directory: semantra-media-portable
        run: cargo test --release --target ${{ matrix.rust_target }}

      # Every Model method end to end on this platform's ONNX Runtime (CPU).
      - name: semantra-embed smoke test
        working-directory: semantra-embed
        env:
          SEMANTRA_ORT_EP: cpu
        run: |
          lib="$(find "$GITHUB_WORKSPACE/src-tauri/onnxruntime" -maxdepth 1 \( -name onnxruntime.dll -o -name libonnxruntime.so -o -name libonnxruntime.dylib \) | head -1)"
          echo "ONNX Runtime: $lib"
          # shellcheck disable=SC2086 # SMOKE_MEDIA is a space-separated list
          ORT_DYLIB_PATH="$lib" cargo run --release --target ${{ matrix.rust_target }} --example smoke -- \
            "$GITHUB_WORKSPACE/src-tauri/models/embeddinggemma-2-onnx" $SMOKE_MEDIA

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: App unit tests
        working-directory: src-tauri
        run: cargo test --release --lib --target ${{ matrix.rust_target }}

      # Unsigned installer per platform (the ONNX bundle config is merged
      # automatically on Windows/Linux; Intel Macs pass it explicitly).
      - name: Build installer
        run: pnpm tauri build --target ${{ matrix.rust_target }} --config src-tauri/tauri.onnx.conf.json --no-sign

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: semantra-${{ matrix.rust_target }}
          path: ${{ matrix.bundle_glob }}
          retention-days: 7
          if-no-files-found: error
