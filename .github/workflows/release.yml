name: Release

# Builds installers for every platform via tauri-action:
#   • macOS (Apple Silicon): MLX backend; signed + notarized.
#   • macOS (Intel): ONNX Runtime backend; signed + notarized.
#   • Windows x64 (NSIS): ONNX Runtime backend; signed with Azure Trusted
#     Signing (GitHub OIDC -> Entra federated credential; no stored secret).
#   • Linux x64 (deb, AppImage): ONNX Runtime backend; unsigned.
#
#   • Push a tag `vX.Y.Z`  -> builds and uploads to a DRAFT GitHub Release.
#   • Run manually (Actions -> Release -> Run workflow) -> builds and uploads the
#                             installer as a workflow artifact (dry run).
#
# The EmbeddingGemma 2 weights (~1.5 GB BF16, gitignored) are fetched ONCE in
# the `prepare-model` job and shared to the MLX build as an artifact; they are
# used as published — never converted to F16 (the model overflows F16). ONNX
# builds fetch the onnx-community fp16 export instead (cached).
#
# macOS signing is REQUIRED on the macOS jobs: they read Developer ID + notarization
# credentials from repository secrets (see APPLE_* below). Missing secrets cause
# the build to fail at the signing/notarization step — by design.
#
# In-app updates: the bundle also produces a minisign-signed .app.tar.gz and
# tauri-action uploads `latest.json`, which installed apps poll via
# releases/latest (so an update goes live when the draft is published). The
# signing key is TAURI_SIGNING_PRIVATE_KEY; its public half is in
# tauri.conf.json (plugins.updater.pubkey).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Allow the workflow to create the release and upload assets.
permissions:
  contents: write
  # Windows code signing logs in to Azure with a GitHub OIDC token.
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # Fetch the model once and share it to the build job as an artifact.
  # ---------------------------------------------------------------------------
  prepare-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Downloads google/embeddinggemma-2 into src-tauri/models/embeddinggemma-2/.
      # Must match MODEL_NAME in lib.rs. HF_TOKEN is optional (rate limits).
      - name: Fetch embeddinggemma-2
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash src-tauri/fetch-model.sh

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-embeddinggemma-2
          path: src-tauri/models/embeddinggemma-2
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build the app on an Apple Silicon runner (MLX compiles its Metal kernels
  # with the Xcode toolchain, so no cross-compilation).
  # ---------------------------------------------------------------------------
  build:
    needs: prepare-model
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon: the MLX backend (BF16 safetensors + Metal kernels).
          - name: macOS (Apple Silicon)
            os: macos-26
            backend: mlx
            rust_target: aarch64-apple-darwin
            toolchain_targets: aarch64-apple-darwin
            pdfium: pdfium-mac-arm64.tgz
            args: "--target aarch64-apple-darwin"
          # Everything else: the ONNX Runtime backend (fp16 ONNX export + a
          # bundled runtime; see scripts/fetch-onnxruntime.sh).
          - name: macOS (Intel)
            os: macos-15-intel
            backend: onnx
            ort: macos-x64
            rust_target: x86_64-apple-darwin
            toolchain_targets: x86_64-apple-darwin
            pdfium: pdfium-mac-x64.tgz
            args: "--target x86_64-apple-darwin --config src-tauri/tauri.onnx.conf.json"
          - name: Windows x64
            os: windows-latest
            backend: onnx
            ort: windows-x64
            rust_target: x86_64-pc-windows-msvc
            toolchain_targets: x86_64-pc-windows-msvc
            # + the signCommand config generated by "Set up Windows code signing".
            args: "--target x86_64-pc-windows-msvc --config src-tauri/tauri.windows-sign.conf.json"
          - name: Linux x64
            os: ubuntu-22.04
            backend: onnx
            ort: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            toolchain_targets: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu"

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The Entra ID federated credential trusts OIDC tokens from this
    # environment (subject repo:freedmand@306095/semantra@1275491088:environment:release).
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf

      # MLX (built from source by mlx-sys via CMake) compiles Metal shaders;
      # Xcode 26 ships the Metal toolchain as a separate download. The macOS 26
      # SDK is also required to target macOS 26.2 (bundle.macOS
      # .minimumSystemVersion), which enables MLX's M5 neural-accelerator
      # kernels.
      - name: Install Metal toolchain
        if: matrix.backend == 'mlx'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain

      # The lance/datafusion stack runs `protoc` at build time to codegen its
      # protobuf types. Not preinstalled on the runners; this action installs it
      # cross-platform (macOS/Linux/Windows) and puts it on PATH.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.toolchain_targets }}

      # Cache the (large) Rust dependency build — datafusion/lance/MLX dominate
      # compile time. Scoped to the src-tauri crate.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.rust_target }}
          # Bump when mlx-sys's metallib location changes: a restored build
          # skips mlx-sys's build script, so the kernels wouldn't be regenerated
          # into src-tauri/mlx/ (stage-metallib.sh would then fail the build).
          prefix-key: "v1-mlx-metallib"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Restore the shared weights so the bundle resource
      # (models/embeddinggemma-2/*) is present at build time.
      - name: Download model artifact
        if: matrix.backend == 'mlx'
        uses: actions/download-artifact@v4
        with:
          name: model-embeddinggemma-2
          path: src-tauri/models/embeddinggemma-2

      # ONNX backend: the fp16 export and this platform's ONNX Runtime library
      # (Intel Macs build it from source once; cached).
      # Restored here and saved right after the build (not at job end), so a
      # later failing step doesn't throw away the ~25 min build.
      - name: Restore ONNX Runtime source build (Intel Mac)
        id: ort-cache
        if: matrix.ort == 'macos-x64'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/semantra/onnxruntime-1.27.0/onnxruntime/build/x86_64/Release/libonnxruntime.1.27.0.dylib
          key: onnxruntime-1.27.0-macos-x64-v1

      - name: Fetch ONNX Runtime
        if: matrix.backend == 'onnx'
        run: bash src-tauri/scripts/fetch-onnxruntime.sh ${{ matrix.ort }}

      # Windows/Linux: the ffmpeg sidecar (bundle.externalBin) the portable
      # media decoders use for video, HEIC and extra audio codecs.
      - name: Fetch ffmpeg sidecar
        if: matrix.backend == 'onnx' && runner.os != 'macOS'
        run: bash src-tauri/scripts/fetch-ffmpeg.sh ${{ matrix.ort }}

      - name: Save ONNX Runtime source build (Intel Mac)
        if: matrix.ort == 'macos-x64' && steps.ort-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/semantra/onnxruntime-1.27.0/onnxruntime/build/x86_64/Release/libonnxruntime.1.27.0.dylib
          key: onnxruntime-1.27.0-macos-x64-v1

      - name: Cache ONNX model
        if: matrix.backend == 'onnx'
        uses: actions/cache@v4
        with:
          path: src-tauri/models/embeddinggemma-2-onnx
          key: embeddinggemma-2-onnx-fp16-v1

      - name: Fetch ONNX model
        if: matrix.backend == 'onnx'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash src-tauri/scripts/fetch-model-onnx.sh

      # Notarization requires EVERY Mach-O in the bundle to be Developer-ID-signed
      # with a secure timestamp. Tauri signs the main binary + the .app, but the
      # bundled libpdfium.dylib (a loose dylib under Resources/) is left unsigned,
      # so the notary rejects the whole archive. Fix: fetch + sign the dylib here
      # and drop it where build.rs caches it (build.rs skips the download when the
      # file already exists), so the bundle picks up the signed copy. macOS only.
      - name: Pre-sign bundled libpdfium
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # Keep this tag in sync with PDFIUM_RELEASE in src-tauri/build.rs.
          PDFIUM_TAG="chromium%2F7881"
          BASE="https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}"
          mkdir -p src-tauri/libpdfium
          curl -fSL --retry 3 -o "$RUNNER_TEMP/pdfium.tgz" "$BASE/${{ matrix.pdfium }}"
          tar xzf "$RUNNER_TEMP/pdfium.tgz" -C "$RUNNER_TEMP" lib/libpdfium.dylib
          cp "$RUNNER_TEMP/lib/libpdfium.dylib" src-tauri/libpdfium/libpdfium.dylib

          # Import the Developer ID cert into a dedicated keychain so codesign can
          # find the identity (tauri-action's own keychain isn't set up yet).
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/libpdfium-signing.keychain-db"
          KCPW="$(openssl rand -base64 24)"
          security create-keychain -p "$KCPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KCPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          codesign --force --timestamp --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" src-tauri/libpdfium/libpdfium.dylib
          echo "--- libpdfium signature ---"
          codesign -dvv src-tauri/libpdfium/libpdfium.dylib 2>&1 \
            | grep -iE "Authority|Timestamp|Signature|Runtime" || true
          # The ONNX backend's bundled runtime is a loose dylib too (Intel).
          if [[ -f src-tauri/onnxruntime/libonnxruntime.dylib ]]; then
            codesign --force --timestamp --options runtime \
              --sign "$APPLE_SIGNING_IDENTITY" src-tauri/onnxruntime/libonnxruntime.dylib
          fi
          rm -f "$RUNNER_TEMP/cert.p12"

      # Windows: Azure Trusted Signing via signtool + Microsoft's signing dlib.
      # Tauri calls scripts/sign-windows.sh (signCommand) for each binary.
      - name: Set up Windows code signing
        if: runner.os == 'Windows'
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: bash src-tauri/scripts/setup-windows-signing.sh

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          # Required by tauri-action to create the GitHub Release and upload
          # assets on tag builds (the workflow grants `contents: write`).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- macOS code signing (Developer ID) ---
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # --- macOS notarization ---
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # --- Windows code signing (Azure Trusted Signing, via OIDC) ---
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # --- updater artifact signing (minisign) ---
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Create a draft release only when triggered by a version tag.
          # On manual (workflow_dispatch) runs tagName is empty -> no release;
          # installers are uploaded as workflow artifacts in the next step.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Semantra {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # Dry-run convenience: when not building a release, surface the installer
      # as a downloadable workflow artifact so it can be inspected/tested.
      - name: Upload installers (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.rust_target }}
          path: src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The four build jobs each merge their platform into the release's
  # latest.json (the in-app updater feed) in parallel; fail loudly if a race
  # dropped one, so it can be re-run before publishing.
  # ---------------------------------------------------------------------------
  verify-updater-feed:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check latest.json lists every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" -p latest.json -O latest.json
          python3 - <<'PY'
          import json, sys
          platforms = json.load(open("latest.json"))["platforms"]
          need = ["darwin-aarch64", "darwin-x86_64", "windows-x86_64", "linux-x86_64"]
          missing = [p for p in need if p not in platforms]
          print("platforms:", sorted(platforms))
          sys.exit(f"latest.json is missing {missing}" if missing else 0)
          PY
